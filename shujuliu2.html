<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iCraft Editor Embedded</title>
  <!-- 引入 React 和 ReactDOM 的 CDN -->
  <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
  <!-- 引入 Babel 以支持 JSX 语法 -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <!-- 定义 React 组件将渲染的容器 -->
  <div id="root"></div>
  <script type="text/babel">
    // 定义样式对象
    const style = {
      width: "100%",
      height: "500px",
      position: "relative",
      overflow: "hidden"
    };

    // 定义编辑器基础 URL
    const EDITOR_BASE_URL = "https://icraft.gantcloud.com/editor";

    // 定义 React 函数式组件
    const ICraftEditor = () => {
      const params = new URLSearchParams({
        url: "https://g3mni.github.io/shujujiami.icraft",
        preview: "true",
        defaultAnimationPlan: "0",
        autoPlay: "true",
        loop: "true"
      });

      const src = `${EDITOR_BASE_URL}?${params.toString()}`;

      return (
        <div style={style}>
          <iframe
            src={src}
            title='iCraft Editor'
            width='100%'
            height='100%'
            style={{ border: "none" }}
            allowFullScreen
          />
        </div>
      );
    };

    // 将组件渲染到 DOM 中
    ReactDOM.render(<ICraftEditor />, document.getElementById('root'));
  </script>
</body>

</html>
